<title>Гра в Літери</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen app — header bar, word plate, card table filling the rest */
:root {
  --bg: #eef3fb;
  --surface: #ffffff;
  --ink: #1d2a44;
  --muted: #6b7895;
  --line: #d6dfee;
  --p1: #8a3ffc;
  --p2: #f07a12;
  --blue: #1f5fd6;
  --yellow: #ffd23a;
  --card-face: #fffdf4;
  --good: #1f9d55;
  --d-orange: #f07a12;
  --d-green: #22a447;
  --d-blue: #1f6fe0;
  --d-purple: #8a3ffc;
  --font-display: "Unbounded", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --shadow: 0 6px 18px rgba(29, 42, 68, .14);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111827; --surface: #1b2436; --ink: #eef2fb; --muted: #9aa6c0; --line: #2c3850;
    --p1: #b083ff; --p2: #ff9a45; --blue: #5b93ff; --card-face: #fff8e2; --good: #3ccf7a;
    --shadow: 0 6px 18px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111827; --surface: #1b2436; --ink: #eef2fb; --muted: #9aa6c0; --line: #2c3850;
  --p1: #b083ff; --p2: #ff9a45; --blue: #5b93ff; --card-face: #fff8e2; --good: #3ccf7a;
  --shadow: 0 6px 18px rgba(0, 0, 0, .45); color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 16px; overflow: hidden; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.screen { height: 100%; display: flex; flex-direction: column; padding: 16px; padding-block: 12px; box-sizing: border-box; max-width: 1100px; margin: 0 auto; }
.screen[hidden] { display: none !important; }

/* ---------- Start screen ---------- */
#start { overflow-y: auto; gap: 18px; align-items: stretch; max-width: 560px; }
.brand { display: flex; align-items: center; gap: 12px; padding-top: 8px; }
.brand-cards { display: flex; }
.brand-cards span {
  width: 34px; height: 45px; border-radius: 7px; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-size: 20px; box-shadow: var(--shadow);
}
.brand-cards span:nth-child(1) { background: linear-gradient(45deg, var(--yellow), var(--blue)); transform: rotate(-8deg); }
.brand-cards span:nth-child(2) { background: var(--card-face); color: #1f5fd6; margin-left: -8px; transform: rotate(6deg); }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 6vw, 34px); margin: 0; letter-spacing: -.01em; }
.tagline { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
.panel { background: var(--surface); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.label { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.player-row { display: flex; align-items: center; gap: 10px; }
.dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.player-row input {
  flex: 1; min-width: 0; font: inherit; font-size: 18px; font-weight: 700; color: var(--ink);
  background: var(--bg); border: 2px solid transparent; border-radius: 12px; padding: 10px 12px;
}
.player-row input:focus { border-color: var(--line); outline: none; }
.player-row input:disabled { opacity: .8; }
.switch { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 4px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.switch .track { width: 44px; height: 26px; border-radius: 13px; background: var(--line); position: relative; transition: background .2s; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch[aria-pressed="true"] { color: var(--blue); }
.switch[aria-pressed="true"] .track { background: var(--blue); }
.switch[aria-pressed="true"] .track::after { transform: translateX(18px); }
.levels { display: flex; gap: 8px; }
.levels[hidden] { display: none !important; }
.levels button {
  flex: 1; border: 2px solid var(--line); background: transparent; border-radius: 12px;
  padding: 9px 4px; font-weight: 800; color: var(--muted); transition: all .15s;
}
.levels button[aria-pressed="true"] { color: #fff; border-color: transparent; }
.levels button[data-level="easy"][aria-pressed="true"] { background: var(--good); }
.levels button[data-level="normal"][aria-pressed="true"] { background: #e3a500; }
.levels button[data-level="hard"][aria-pressed="true"] { background: #e0413a; }
.decks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.deck {
  border: 2px solid var(--line); background: transparent; border-radius: 14px; padding: 10px 4px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; transition: transform .15s, border-color .15s;
}
.deck svg { width: 34px; height: 34px; transition: transform .2s; }
.deck .heart-fill { fill: transparent; transition: fill .2s; }
.deck[aria-pressed="true"] { border-color: var(--c); }
.deck[aria-pressed="true"] .heart-fill { fill: var(--c); }
.deck[aria-pressed="true"] svg { transform: scale(1.18); }
.deck small { font-size: 11px; color: var(--muted); font-weight: 700; line-height: 1.2; text-align: center; }
.counts { display: flex; justify-content: space-between; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.counts b { color: var(--ink); }
.primary {
  border: 0; border-radius: 16px; padding: 16px; font-family: var(--font-display); font-weight: 700; font-size: 20px;
  background: var(--good); color: #fff; box-shadow: var(--shadow); transition: transform .1s, opacity .2s;
}
.primary:active { transform: scale(.98); }
.primary:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
.hint { text-align: center; color: var(--muted); font-size: 14px; margin: -8px 0 0; }

/* ---------- Game screen ---------- */
#game { gap: 10px; }
.bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.side { display: flex; flex-direction: column; gap: 2px; min-width: 0; transition: opacity .25s; opacity: .45; }
.side.right { align-items: flex-end; text-align: right; }
.side.active { opacity: 1; }
.side .name { font-family: var(--font-display); font-weight: 700; font-size: clamp(15px, 3.4vw, 20px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.side .score { font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
.side.p1 .name, .side.p1 .score { color: var(--p1); }
.side.p2 .name, .side.p2 .score { color: var(--p2); }
.side .turn { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); height: 16px; }
.center { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.left-count { font-family: var(--font-display); font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
.menu-btn { border: 0; background: var(--surface); border-radius: 10px; padding: 4px 10px; font-weight: 800; font-size: 13px; color: var(--muted); box-shadow: var(--shadow); }
.pop { animation: pop .5s ease; }
@keyframes pop { 40% { transform: scale(1.35); } }

.word {
  align-self: center; display: flex; gap: clamp(4px, 1.2vw, 8px); padding: 10px 16px; border-radius: 16px;
  background: var(--surface); box-shadow: var(--shadow); flex-wrap: wrap; justify-content: center;
}
.word span {
  font-family: var(--font-display); font-weight: 800; font-size: clamp(24px, 6vw, 38px); line-height: 1.1;
  color: var(--ink); min-width: .7em; text-align: center; border-bottom: 4px solid var(--line); padding-bottom: 2px;
  transition: color .3s, border-color .3s;
}
.word span.found { color: var(--good); border-color: var(--good); animation: pop .45s ease; }
.word span.apos { border-color: transparent; min-width: 0; }

.table { flex: 1; min-height: 0; display: grid; place-items: center; }
.grid { display: grid; gap: 8px; justify-content: center; align-content: center; }
.card {
  perspective: 700px; border: 0; padding: 0; background: none; position: relative;
}
.card .inner {
  position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3,.7,.3,1.2);
}
.card.open .inner { transform: rotateY(180deg); }
.card .back, .card .face {
  position: absolute; inset: 0; border-radius: 12%; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  box-shadow: var(--shadow);
}
.card .back {
  background:
    radial-gradient(circle at 30% 25%, rgba(255,255,255,.35) 0 18%, transparent 19%),
    linear-gradient(45deg, var(--yellow) 0%, #8fc0ff 55%, #1f5fd6 100%);
}
.card .back::after {
  content: ""; position: absolute; inset: 9%; border-radius: 10%; border: 2px solid rgba(255,255,255,.55);
}
.card .face {
  background: var(--card-face); transform: rotateY(180deg); display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; color: #1f5fd6; border: 3px solid transparent; box-sizing: border-box;
}
.card.hit .face { border-color: var(--good); color: #17804a; }
.card.miss .face { border-color: #e0413a; color: #c4322b; }
.card:not(.open):hover .inner { transform: translateY(-3px) rotateY(0); }
.card:disabled { cursor: default; }
.locked .card { cursor: default; }

/* ---------- Results ---------- */
#results { justify-content: center; gap: 18px; max-width: 520px; text-align: center; }
#results h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 7vw, 38px); margin: 0; text-wrap: balance; }
.final { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.final .panel { align-items: center; text-align: center; gap: 6px; }
.final .big { font-family: var(--font-display); font-weight: 800; font-size: 44px; font-variant-numeric: tabular-nums; line-height: 1; }
.final .who { font-weight: 800; font-size: 17px; overflow-wrap: anywhere; }
.final ul { list-style: none; padding: 0; margin: 4px 0 0; display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.final li { font-size: 13px; font-weight: 700; background: var(--bg); border-radius: 8px; padding: 2px 8px; }
.final .winner { outline: 3px solid currentColor; }
.row-btns { display: flex; gap: 10px; }
.row-btns button { flex: 1; }
.secondary { border: 2px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px; font-weight: 800; font-size: 17px; }

canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
@media (prefers-reduced-motion: reduce) {
  .card .inner, .word span, .pop { transition: none !important; animation: none !important; }
}
@media (max-width: 380px) { .deck small { display: none; } }
</style>

<canvas id="fx"></canvas>

<!-- START -->
<section class="screen" id="start">
  <div class="brand">
    <div class="brand-cards" aria-hidden="true"><span></span><span>Ї</span></div>
    <h1>Гра в Літери</h1>
  </div>
  <p class="tagline">Відкривай картки й збирай літери загаданого слова. Вгадав літеру — ходиш ще раз. Хто зібрав слово, забирає його собі.</p>

  <div class="panel">
    <span class="label">Гравці</span>
    <div class="player-row">
      <span class="dot" style="background: var(--p1)"></span>
      <input id="name1" maxlength="16" placeholder="Гравець 1" autocomplete="off">
    </div>
    <div class="player-row">
      <span class="dot" style="background: var(--p2)"></span>
      <input id="name2" maxlength="16" placeholder="Гравець 2" autocomplete="off">
      <button class="switch" id="cpuToggle" aria-pressed="false" type="button">
        <span class="track"></span> Комп'ютер
      </button>
    </div>
    <div class="levels" id="levels" hidden>
      <button type="button" data-level="easy" aria-pressed="false">Легко</button>
      <button type="button" data-level="normal" aria-pressed="true">Нормально</button>
      <button type="button" data-level="hard" aria-pressed="false">Складно</button>
    </div>
  </div>

  <div class="panel">
    <span class="label">Колоди карток</span>
    <div class="decks" id="decks"></div>
    <div class="counts"><span>Літер у грі: <b id="cntLetters">0</b></span><span>Слів у грі: <b id="cntWords">0</b></span></div>
  </div>

  <button class="primary" id="newGame" disabled>Нова гра</button>
  <p class="hint" id="startHint">Обери хоча б одну колоду</p>
</section>

<!-- GAME -->
<section class="screen" id="game" hidden>
  <div class="bar">
    <div class="side p1" id="side1"><span class="turn" id="turn1"></span><span class="name" id="g-name1"></span><span class="score" id="g-score1"></span></div>
    <div class="center">
      <button class="menu-btn" id="toMenu" type="button">Меню</button>
      <span class="left-count" id="wordsLeft" title="Слів залишилось">0</span>
    </div>
    <div class="side p2 right" id="side2"><span class="turn" id="turn2"></span><span class="name" id="g-name2"></span><span class="score" id="g-score2"></span></div>
  </div>
  <div class="word" id="word" aria-live="polite"></div>
  <div class="table" id="table"><div class="grid" id="grid"></div></div>
</section>

<!-- RESULTS -->
<section class="screen" id="results" hidden>
  <h2 id="resTitle"></h2>
  <div class="final">
    <div class="panel" id="res1" style="color: var(--p1)"><span class="big" id="r-score1"></span><span class="who" id="r-name1"></span><ul id="r-words1"></ul></div>
    <div class="panel" id="res2" style="color: var(--p2)"><span class="big" id="r-score2"></span><span class="who" id="r-name2"></span><ul id="r-words2"></ul></div>
  </div>
  <div class="row-btns">
    <button class="secondary" id="toStart" type="button">До меню</button>
    <button class="primary" id="again" type="button">Ще раз</button>
  </div>
</section>

<script>
(() => {
  // ---------- Data (from ModelData.swift) ----------
  const DECKS = [
    { id: "orange", color: "var(--d-orange)", name: "Помаранчева",
      letters: ["А","В","Е","І","Л","Н","О","П","С"],
      words: ["Поні","Алое","Лев","Ліс","Сіно","Оса","Слон","Сова"] },
    { id: "green", color: "var(--d-green)", name: "Зелена",
      letters: ["А","В","Д","Е","Є","И","І","К","Л","М","Н","О","П","Т","Ш","Ь","Ю","Я"],
      words: ["Поні","Алое","Лев","Єнот","Індик","Конвалія","Пітон","Миша","Півень","Тюлень","Пелікан"] },
    { id: "blue", color: "var(--d-blue)", name: "Синя",
      letters: ["А","Б","В","Е","Є","З","Й","К","Л","М","Н","О","С","У","Х","Ц","Ь","Я"],
      words: ["Буйвол","Алое","Лев","Заєць","Козел","Оса","Слон","Сова","Сойка","Хомʼяк","Ему"] },
    { id: "purple", color: "var(--d-purple)", name: "Фіолетова",
      letters: ["А","Б","Г","Ґ","Д","Е","И","Ї","Ф","Ж","З","К","П","Р","У","Ч","Щ","Ь"],
      words: ["Курча","Грак","Гриф","Їжак","Жираф","Зебра","Ґедзь","Гепард","Чиж","Карп","Щука"] },
  ];
  const APOS = /[ʼ'’]/;
  const TIME_PLAYER = 900, TIME_CPU_OPEN = 1500, TIME_CPU_THINK = 1000, TIME_NEXT_WORD = 1400;
  const FORGET = { easy: 5, normal: 3, hard: 1 };

  const $ = (id) => document.getElementById(id);
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const lower = (s) => s.toLocaleLowerCase("uk");
  const needed = (word) => new Set([...lower(word)].filter(ch => !APOS.test(ch)));

  // ---------- Settings (remembered in this browser) ----------
  const store = {
    get() { try { return JSON.parse(localStorage.getItem("letters-game") || "{}"); } catch { return {}; } },
    set(v) { try { localStorage.setItem("letters-game", JSON.stringify(v)); } catch {} },
  };
  const saved = store.get();
  const settings = {
    name1: saved.name1 || "",
    name2: saved.name2 || "",
    cpu: !!saved.cpu,
    level: saved.level || "normal",
    decks: new Set(saved.decks || []),
  };
  const save = () => store.set({ ...settings, decks: [...settings.decks] });

  // ---------- Start screen ----------
  const name1 = $("name1"), name2 = $("name2"), cpuToggle = $("cpuToggle"), levels = $("levels");
  name1.value = settings.name1; name2.value = settings.name2;
  name1.addEventListener("input", () => { settings.name1 = name1.value.trim(); save(); });
  name2.addEventListener("input", () => { if (!settings.cpu) { settings.name2 = name2.value.trim(); save(); } });

  function renderCpu() {
    cpuToggle.setAttribute("aria-pressed", settings.cpu);
    levels.hidden = !settings.cpu;
    name2.disabled = settings.cpu;
    name2.value = settings.cpu ? "Комп'ютер" : settings.name2;
    levels.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.level === settings.level));
  }
  cpuToggle.addEventListener("click", () => { settings.cpu = !settings.cpu; save(); renderCpu(); });
  levels.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    settings.level = b.dataset.level; save(); renderCpu();
  });

  const HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path class="heart-fill" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.4 4.5 6.9 4.5c2.1 0 3.6 1.2 5.1 3 1.5-1.8 3-3 5.1-3 3.5 0 5.5 3.5 4.2 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>';
  const decksEl = $("decks");
  DECKS.forEach(d => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "deck"; b.dataset.id = d.id;
    b.style.setProperty("--c", d.color); b.style.color = d.color;
    b.setAttribute("aria-label", `${d.name} колода`);
    b.innerHTML = `${HEART}<small>${d.letters.length} літер<br>${d.words.length} слів</small>`;
    b.addEventListener("click", () => {
      settings.decks.has(d.id) ? settings.decks.delete(d.id) : settings.decks.add(d.id);
      save(); renderDecks();
    });
    decksEl.appendChild(b);
  });

  function pool() {
    const letters = new Set(), words = new Set();
    DECKS.filter(d => settings.decks.has(d.id)).forEach(d => { d.letters.forEach(l => letters.add(l)); d.words.forEach(w => words.add(w)); });
    const low = new Set([...letters].map(lower));
    // keep only words that can actually be collected from the chosen letters
    const ok = [...words].filter(w => [...needed(w)].every(ch => low.has(ch)));
    return { letters: [...letters], words: ok };
  }
  function renderDecks() {
    decksEl.querySelectorAll(".deck").forEach(b => b.setAttribute("aria-pressed", settings.decks.has(b.dataset.id)));
    const p = pool();
    $("cntLetters").textContent = p.letters.length;
    $("cntWords").textContent = p.words.length;
    $("newGame").disabled = p.words.length === 0;
    $("startHint").hidden = p.words.length > 0;
  }
  renderCpu(); renderDecks();

  // ---------- CPU (from AutoMovesAI.swift) ----------
  class CPU {
    constructor(level) { this.level = level; this.memory = new Map(); }  // letter -> card index
    seen(letter, index) { this.memory.set(lower(letter), index); }
    forgetSome() {
      let n = FORGET[this.level];
      while (n > 0 && this.memory.size > n) { this.memory.delete(this.memory.keys().next().value); n--; }
    }
    move(g) {
      for (const ch of needed(g.secret)) {
        if (g.found.has(ch)) continue;
        const idx = this.memory.get(ch);
        if (idx !== undefined && !g.open.has(idx)) return idx;
      }
      const known = new Set(this.memory.values());
      const closed = g.letters.map((_, i) => i).filter(i => !g.open.has(i));
      const fresh = closed.filter(i => !known.has(i));
      const from = fresh.length ? fresh : closed;
      return from[Math.floor(Math.random() * from.length)];
    }
  }

  // ---------- Game ----------
  let g = null;
  const timers = new Set();
  const later = (fn, ms) => { const t = setTimeout(() => { timers.delete(t); fn(); }, ms); timers.add(t); };
  const clearTimers = () => { timers.forEach(clearTimeout); timers.clear(); };

  function show(id) { ["start", "game", "results"].forEach(s => $(s).hidden = s !== id); }

  function startGame() {
    clearTimers();
    const p = pool();
    g = {
      names: [settings.name1 || "Гравець 1", settings.cpu ? "Комп'ютер" : (settings.name2 || "Гравець 2")],
      vsCPU: settings.cpu,
      cpu: settings.cpu ? new CPU(settings.level) : null,
      letters: shuffle([...p.letters]),
      words: shuffle([...p.words]),
      secret: "", found: new Set(), open: new Set(),
      turn: 0, scores: [0, 0], won: [[], []], busy: false,
    };
    g.secret = g.words[0];
    $("g-name1").textContent = g.names[0];
    $("g-name2").textContent = g.names[1];
    buildGrid(); renderBar(); renderWord();
    show("game"); layout();
  }

  function buildGrid() {
    const grid = $("grid");
    grid.innerHTML = "";
    g.letters.forEach((l, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "card"; b.dataset.i = i;
      b.setAttribute("aria-label", "Закрита картка");
      b.innerHTML = `<span class="inner"><span class="back"></span><span class="face">${l}</span></span>`;
      grid.appendChild(b);
    });
  }

  function layout() {
    if (!g || $("game").hidden) return;
    const table = $("table"), grid = $("grid");
    const W = table.clientWidth, H = table.clientHeight, n = g.letters.length, gap = W < 500 ? 6 : 10;
    let best = { cols: 1, w: 0 };
    for (let cols = 1; cols <= n; cols++) {
      const rows = Math.ceil(n / cols);
      const w = Math.min((W - gap * (cols - 1)) / cols, ((H - gap * (rows - 1)) / rows) * 0.75, 150);
      if (w > best.w) best = { cols, w };
    }
    const w = Math.floor(best.w);
    grid.style.gap = gap + "px";
    grid.style.gridTemplateColumns = `repeat(${best.cols}, ${w}px)`;
    grid.querySelectorAll(".card").forEach(c => { c.style.width = w + "px"; c.style.height = Math.floor(w * 4 / 3) + "px"; c.querySelector(".face").style.fontSize = Math.floor(w * .56) + "px"; });
  }
  addEventListener("resize", layout);

  function renderBar() {
    [0, 1].forEach(p => {
      $("side" + (p + 1)).classList.toggle("active", g.turn === p);
      $("turn" + (p + 1)).textContent = g.turn === p ? (g.vsCPU && p === 1 ? "думає…" : "хід") : "";
      $("g-score" + (p + 1)).textContent = `Карток: ${g.scores[p]}`;
    });
    $("wordsLeft").textContent = g.words.length;
    $("grid").classList.toggle("locked", isLocked());
  }

  function renderWord() {
    const el = $("word");
    el.innerHTML = "";
    [...g.secret].forEach(ch => {
      const s = document.createElement("span");
      s.textContent = ch;
      if (APOS.test(ch)) s.className = "apos";
      else if (g.found.has(lower(ch))) s.className = "found";
      el.appendChild(s);
    });
  }

  const isLocked = () => g.busy || (g.vsCPU && g.turn === 1);
  const cardEl = (i) => $("grid").children[i];

  function openCard(i) {
    g.open.add(i);
    const c = cardEl(i);
    c.classList.add("open");
    c.setAttribute("aria-label", `Літера ${g.letters[i]}`);
  }
  function closeCard(i) {
    g.open.delete(i);
    const c = cardEl(i);
    c.classList.remove("open", "hit", "miss");
    c.setAttribute("aria-label", "Закрита картка");
  }

  $("grid").addEventListener("click", (e) => {
    const c = e.target.closest(".card");
    if (!c || !g || isLocked()) return;
    const i = +c.dataset.i;
    if (g.open.has(i)) return;
    g.busy = true; renderBar();
    openCard(i);
    later(() => resolve(i), TIME_PLAYER);
  });

  function resolve(i) {
    const letter = g.letters[i], ch = lower(letter);
    if (g.cpu) g.cpu.seen(letter, i);
    const c = cardEl(i);
    if (needed(g.secret).has(ch)) {
      c.classList.add("hit");
      g.found.add(ch);
      renderWord();
    } else {
      c.classList.add("miss");
      later(() => { closeCard(i); }, 350);
      g.turn = 1 - g.turn;
    }

    const req = needed(g.secret);
    if ([...req].every(x => g.found.has(x))) {
      g.scores[g.turn] += 1;
      g.won[g.turn].push(g.secret);
      renderBar();
      const sc = $("g-score" + (g.turn + 1)); sc.classList.remove("pop"); void sc.offsetWidth; sc.classList.add("pop");
      sparkle(req.size + 1);
      later(nextWord, TIME_NEXT_WORD);
      return;
    }
    g.busy = false;
    renderBar();
    if (g.vsCPU && g.turn === 1) later(cpuMove, TIME_CPU_THINK);
  }

  function nextWord() {
    g.words.shift();
    g.letters.forEach((_, i) => closeCard(i));
    g.found.clear();
    if (!g.words.length) { g.busy = false; return finish(); }
    shuffle(g.words);
    g.secret = g.words[0];
    g.turn = 1 - g.turn;
    if (g.cpu) g.cpu.forgetSome();
    g.busy = false;
    renderWord(); renderBar();
    if (g.vsCPU && g.turn === 1) later(cpuMove, TIME_CPU_THINK + 500);
  }

  function cpuMove() {
    if (!g || $("game").hidden) return;
    g.busy = true;
    const i = g.cpu.move(g);
    openCard(i);
    later(() => resolve(i), TIME_CPU_OPEN);
  }

  function finish() {
    const [a, b] = g.scores;
    $("resTitle").textContent = a === b ? "Нічия!" : `Перемога: ${a > b ? g.names[0] : g.names[1]}`;
    [0, 1].forEach(p => {
      $("r-score" + (p + 1)).textContent = g.scores[p];
      $("r-name" + (p + 1)).textContent = g.names[p];
      $("r-words" + (p + 1)).innerHTML = g.won[p].map(w => `<li>${w}</li>`).join("");
      $("res" + (p + 1)).classList.toggle("winner", g.scores[p] > g.scores[1 - p]);
    });
    show("results");
    if (a !== b) sparkle(12);
  }

  $("newGame").addEventListener("click", startGame);
  $("again").addEventListener("click", startGame);
  $("toStart").addEventListener("click", () => { clearTimers(); g = null; show("start"); });
  $("toMenu").addEventListener("click", () => { clearTimers(); g = null; show("start"); });

  // ---------- Sparkles (SparkleView.swift) ----------
  const fx = $("fx"), ctx = fx.getContext("2d");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let parts = [], fxRunning = false;
  const COLORS = ["#ffd23a", "#5b93ff", "#ff9a45", "#b083ff", "#3ccf7a", "#ffffff"];
  function sparkle(rate) {
    if (reduced) return;
    const dpr = devicePixelRatio || 1;
    fx.width = innerWidth * dpr; fx.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const start = performance.now(), dur = 2600;
    let lastEmit = start;
    const emitter = (t) => ({ x: innerWidth / 2, y: innerHeight * (0.75 - 0.5 * Math.min(1, (t - start) / dur)) });
    const per = Math.max(3, rate * 2);
    function emit(t) {
      const e = emitter(t);
      for (let k = 0; k < per; k++) {
        const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 220;
        parts.push({ x: e.x + Math.cos(a) * 40, y: e.y + Math.sin(a) * 40, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
          r: 6 + Math.random() * 10, rot: Math.random() * 6, spin: (Math.random() - .5) * 8, life: 1.6 + Math.random() * 1.4, age: 0,
          c: COLORS[Math.floor(Math.random() * COLORS.length)] });
      }
    }
    let prev = start;
    function frame(t) {
      const dt = Math.min(.05, (t - prev) / 1000); prev = t;
      if (t - start < dur && t - lastEmit > 60) { emit(t); lastEmit = t; }
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      parts = parts.filter(p => (p.age += dt) < p.life);
      for (const p of parts) {
        p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 60 * dt; p.rot += p.spin * dt;
        ctx.globalAlpha = 1 - p.age / p.life;
        star(p.x, p.y, p.r * (1 - p.age / p.life * .4), p.rot, p.c);
      }
      ctx.globalAlpha = 1;
      if (parts.length || t - start < dur) requestAnimationFrame(frame); else { fxRunning = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
    }
    if (!fxRunning) { fxRunning = true; requestAnimationFrame(frame); }
  }
  function star(x, y, r, rot, c) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath();
    for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * .45 : r, a = i * Math.PI / 5 - Math.PI / 2; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); ctx.fillStyle = c; ctx.fill(); ctx.restore();
  }
})();
</script>
